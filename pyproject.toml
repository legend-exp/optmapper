[build-system]
requires = [
    "setuptools>=77",
    "setuptools_scm[toml]>=7"
]
build-backend = "setuptools.build_meta"

[project]
name = "optmapper"
description = "Production of LEGEND optical maps on batch systems"
authors = [
    { name = "Luigi Pertoldi", email = "gipert@pm.me" },
]
maintainers = [
    { name = "The LEGEND Collaboration" },
]
readme = "README.md"
license = "GPL-3.0"
license-files = ["LICENSE"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
    "colorlog",
    "dbetto",
    "legend-pygeom-optics >=0.15.0",
    "pint",
    "reboost >=1.4",
]
dynamic = [
    "version",
]

[project.urls]
Homepage = "https://github.com/legend-exp/optmapper"
"Bug Tracker" = "https://github.com/legend-exp/optmapper/issues"

[project.optional-dependencies]
all = [
    "optmapper[docs,test]",
]
docs = [
    "furo",
    "myst-parser",
    "sphinx",
    "sphinx-copybutton",
]
test = [
    "pre-commit",
    "pytest>=6.0",
    "pytest-cov",
]

[project.scripts]
optmapper = "optmapper.cli:optmapper_cli"
optmapper-work = "optmapper.work:work_cli"

[tool.setuptools_scm]
write_to = "src/optmapper/_version.py"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.setuptools.package-data]
optmapper = ["templates/*", "sites/*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = "error"
log_cli_level = "info"
testpaths = "tests"

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
extend-select = [
  "B",        # flake8-bugbear
  "I",        # isort
  "ARG",      # flake8-unused-arguments
  "C4",       # flake8-comprehensions
  "EM",       # flake8-errmsg
  "ICN",      # flake8-import-conventions
  "G",        # flake8-logging-format
  "PGH",      # pygrep-hooks
  "PIE",      # flake8-pie
  "PL",       # pylint
  "PT",       # flake8-pytest-style
  "PTH",      # flake8-use-pathlib
  "RET",      # flake8-return
  "RUF",      # Ruff-specific
  "SIM",      # flake8-simplify
  "T20",      # flake8-print
  "UP",       # pyupgrade
  "YTT",      # flake8-2020
  "EXE",      # flake8-executable
  "NPY",      # NumPy specific rules
  "D",        # Docstrings
  "W505",     # Doc line too long
]
ignore = [
  "PLR09",    # Too many <...>
  "PLR2004",  # Magic value used in comparison
  "ISC001",   # Conflicts with formatter
  "PT011",    # too picky pytest.raises() complaint
  "D1",       # It's ok to have undocumented things
  "D203",     # blank line required before class docstring
  "D213",     # Multi-line docstring summary should start at the first line
  "D401",     # Summary does not need to be in imperative mood
]
isort.required-imports = ["from __future__ import annotations"]
pydocstyle.convention = "numpy"
pycodestyle.max-doc-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
